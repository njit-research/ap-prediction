# CI runtime configuration for GitHub Actions runners.
# Paths are relative to the vendor/realtime-regression-sw/ working directory.
# Active profile: in6h_out6h_gnn_transformer (6-hour input, 6-hour / 12-step
# ap30 forecast) -- the NJIT co-author's focal-loss + oversampling retrain of
# the GNN-Transformer (checkpoint gnn_transformer_oversample_dup_2_4_8_best.pt,
# delivered 2026-09-16, selected on the 2022-2025 validation split). The
# workflow runs `run_realtime.py --config ../../configs/realtime.ci.yaml`, then
# scripts/update_site_data.py copies results/predictions/* into site/data/.

profile:
  name: "in6h_out6h_gnn_transformer"
  io: "in6h_out6h"            # 6-hour input (12 steps), 6-hour output (12 steps)
  model: "gnn_transformer"    # GNN with Transformer temporal backend

experiment:
  name: "in6h_out6h_gnn_transformer"

paths:
  checkpoint: "./checkpoint/model_best.pth"
  stats_file: "./checkpoint/table_stats.pkl"
  event_dir: "./dataset/events"
  cache_dir: "./dataset/cache"
  results_dir: "./results"

sources:
  noaa_plasma_url: "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
  noaa_mag_url:    "https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json"
  gfz_hpo_url:     "https://www-app3.gfz-potsdam.de/kp_index/Hp30_ap30_nowcast.txt"
  download_timeout: 30
  max_retries: 3

window:
  lookback_steps: 12          # 6 hours × 2 steps/hour
  forecast_steps: 12          # 6 hours × 2 steps/hour
  boundary_offset_minutes: 2

runtime:
  device: "cpu"
  # "Always emit" policy: keep the anchor at now and impute missing inputs
  # (carry the last value forward) so a forecast is produced every run, even when
  # recent data is delayed/missing. Degraded inputs are reflected in
  # missing_data_filled_fraction (the page warns when it is high).
  missing_data:
    max_gap_fraction: 0.9          # emit unless a variable is almost entirely missing
    ffill_limit_steps: 48          # carry the last value forward across long tail gaps
    require_recent_steps_present: 0  # do not require the most recent steps to be real
    anchor_rollback_max_attempts: 2  # last-resort fallback if the current anchor is unfillable

# Uncertainty band as in the DeepAP paper: a 95 % prediction interval
# μ ± 1.96 σ_pred with σ_pred² = σ_MC² + σ_residual², where σ_MC is the
# MC-dropout sample std and σ_residual² is the checkpoint's residual variance
# on the 2022-2025 validation split (co-author's value for THIS checkpoint,
# in ap30²). Re-measure it whenever the checkpoint changes; 0 gives the raw
# MC band. Plot and attention artifacts are skipped — the site only needs JSON.
analysis:
  plot:
    enable: false
    history_steps: 96
    dpi: 120
  mcd:
    enable: true
    num_samples: 100
    n_std: 1.96
    noise_variance: 156.888489
  attention:
    enable: false
    save_npz: false

# Co-author's stored metrics for this checkpoint (validation split 2022-2025,
# raw ap30 units, deterministic pass): overall MAE 6.826, RMSE 12.85,
# storm-rise (Δpeak ≥ 50) peak MAE 82.0; best epoch 11.
model_provenance:
  val_loss_at_train: 0.0       # focal-loss value not stored in the co-author checkpoint
  val_mae_at_train: 6.826      # raw ap30 MAE, 2022-2025 validation split
  val_rmse_at_train: 12.85     # raw ap30 RMSE
  trained_on_epoch: 11
